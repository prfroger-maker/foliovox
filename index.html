      ['Premium server', App.prefs.serverUrl || '—', !!(FV.Premium.status)],
      ['Premium voices', String(FV.Voices.premium().length), FV.Voices.premium().length > 0]
    ];
    let html = header(t('serviceHealth')) + '<div class="fv-pad">';
    for (const [name, value, ok] of rows) {
      html += '<div class="fv-listitem"><button><strong>' + esc(name) + '</strong><small>' + esc(value) + '</small></button>' +
        '<span class="fv-badge ' + (ok ? 'fv-badge--ok' : 'fv-badge--warn') + '">' + (ok ? 'OK' : '—') + '</span></div>';
    }
    if (!online) html += '<div class="fv-note fv-note--warn"><strong>' + esc(t('offline')) + '</strong><br>' + esc(t('offlineBody')) + '</div>';
    html += '</div>';
    return html;
  }

  function viewError() {
    return header(t('errorTitle')) + '<div class="fv-pad">' +
      '<div class="fv-note fv-note--danger"><strong>' + esc(App.params.message || t('errorBody')) + '</strong>' +
      (App.params.detail ? '<br><small>' + esc(App.params.detail) + '</small>' : '') + '</div>' +
      '<button class="fv-btn fv-btn--primary fv-btn--wide" data-action="tab" data-view="library">' + esc(t('library')) + '</button>' +
      '</div>';
  }

  /* ============================================================ handlers */
  let handlersBound = false;
  function attachHandlers() {
    if (handlersBound) return;
    handlersBound = true;
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', onKey);
  }

  function actionEl(e) {
    let el = e.target;
    while (el && el !== document.body) {
      if (el.getAttribute && el.getAttribute('data-action')) return el;
      if (el.getAttribute && el.getAttribute('data-seg')) return el;
      el = el.parentNode;
    }
    return null;
  }

  async function onClick(e) {
    const el = actionEl(e);
    if (!el) return;
    const segId = el.getAttribute('data-seg');
    const action = el.getAttribute('data-action');
    if (!action && segId) { App.player.seekTo(indexOfSeg(segId)); App.player.play(); return; }
    if (!action) return;
    e.preventDefault();
    await handle(action, el);
  }

  function indexOfSeg(segId) {
    const segs = App.player.segments;
    for (let i = 0; i < segs.length; i++) if (segs[i].id === segId) return i;
    return 0;
  }

  async function handle(action, el) {
    const d = App.doc;
    switch (action) {
      case 'back': back(); break;
      case 'go': go(el.getAttribute('data-view')); await afterGo(el.getAttribute('data-view')); break;
      case 'tab': App.stack = [el.getAttribute('data-view')]; App.view = App.stack[0]; App.params = {}; render(); await afterGo(App.view); break;

      case 'onboard-next': {
        const step = parseInt(el.getAttribute('data-step'), 10);
        if (step >= 2) { App.prefs.onboarded = true; await savePrefs(); replace('mode'); }
        else { App.params = { step: step + 1 }; render(); }
        break;
      }
      case 'onboard-skip': App.prefs.onboarded = true; await savePrefs(); replace('mode'); break;
      case 'mode-local': App.prefs.mode = 'local'; await savePrefs(); App.stack = ['library']; App.view = 'library'; render(); break;
      case 'mode-premium': App.prefs.mode = 'local'; await savePrefs(); App.stack = ['library']; App.view = 'library'; go('ownersetup'); break;

      case 'filter': App.params = Object.assign({}, App.params, { filter: el.getAttribute('data-filter') }); render(); break;
      case 'open': await openDocument(el.getAttribute('data-id')); break;

      case 'go-paste': go('paste'); break;
      case 'scan-rotate': await transformScan(parseInt(el.getAttribute('data-i'), 10), 'rotate'); break;
      case 'scan-enhance': await transformScan(parseInt(el.getAttribute('data-i'), 10), 'enhance'); break;
      case 'scan-crop': await transformScan(parseInt(el.getAttribute('data-i'), 10), 'crop'); break;
      case 'scan-up': moveScan(parseInt(el.getAttribute('data-i'), 10), -1); break;
      case 'scan-down': moveScan(parseInt(el.getAttribute('data-i'), 10), 1); break;
      case 'scan-del': App.scan.pages.splice(parseInt(el.getAttribute('data-i'), 10), 1); render(); break;
      case 'scan-ocr': await runOcrOnScans(); break;
      case 'ocr-confirm': await confirmOcrAndBuild(); break;
      case 'pdf-ocr': toast(t('ocrNeedsNet'), 'info'); await ocrPdfPages(); break;
      case 'pdf-textanyway': await finishImport(App.params.parsed, { fileName: App.params.fileName, sourceHash: App.params.hash }); break;

      case 'paste-save': {
        const body = document.getElementById('fv-paste-body').value;
        const title = document.getElementById('fv-paste-title').value;
        if (!body.trim()) { toast(t('errorBody'), 'warn'); break; }
        await importPastedText(body, title);
        break;
      }
      case 'cancel-busy': App.busy = null; App.stack = ['library']; App.view = 'library'; render(); break;

      case 'read-now': await openReader(); break;
      case 'read-chapter': {
        await openReader();
        const chId = el.getAttribute('data-chapter');
        const idx = App.player.segments.findIndex(function (s) { return s.chapter === chId; });
        if (idx >= 0) App.player.seekTo(idx);
        break;
      }
      case 'toggle-fav': d.favorite = !d.favorite; await FV.Library.saveDocument(d); App.docs = await FV.Library.listDocuments(); render(); break;
      case 'delete-doc':
        if (confirm(t('deleteDocument') + '?')) {
          App.player.stop();
          await FV.Library.deleteDocument(d.id);
          App.docs = await FV.Library.listDocuments();
          App.doc = null; App.plan = null;
          App.stack = ['library']; App.view = 'library'; render();
        }
        break;

      case 'toggle-play': App.player.toggle(); break;
      case 'skip-back': App.player.skipSeconds(-15); break;
      case 'skip-fwd': App.player.skipSeconds(15); break;
      case 'prev-chapter': App.player.prevChapter(); break;
      case 'next-chapter': App.player.nextChapter(); break;
      case 'cycle-speed': {
        const steps = [0.5, 0.75, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
        const i = steps.indexOf(Number(App.player.rate.toFixed(2)));
        const next = steps[(i + 1) % steps.length] || 1;
        App.player.setRate(next);
        App.prefs.speed = next; await savePrefs();
        break;
      }
      case 'sleep-menu': {
        const opts = ['off', '5', '10', '15', '30', '45', '60', 'chapter'];
        const cur = App.prefs.sleep || 'off';
        const next = opts[(opts.indexOf(cur) + 1) % opts.length];
        App.prefs.sleep = next; await savePrefs();
        App.player.setSleepTimer(next);
        toast(t('sleepTimer') + ': ' + (next === 'off' ? t('sleepOff') : next === 'chapter' ? t('endOfChapter') : next + ' ' + t('minutes')), 'info');
        break;
      }

      case 'set-style': d.settings.style = el.getAttribute('data-style'); await saveAndRebuild(); break;
      case 'set-exp': d.settings.experience = el.getAttribute('data-exp'); await saveAndRebuild(); break;
      case 'set-readmode': d.settings.readingMode = el.getAttribute('data-m'); await saveAndRebuild(); break;
      case 'set-target': {
        const lang = el.getAttribute('data-lang');
        d.settings.targetLang = lang || null;
        if (lang && d.settings.readingMode === 'original') d.settings.readingMode = 'translated';
        if (!lang) d.settings.readingMode = 'original';
        await saveAndRebuild();
        break;
      }
      case 'set-doclang': d.language = el.getAttribute('data-lang'); d.languageConfidence = 1; await saveAndRebuild(); break;

      case 'pick-voice': {
        App.prefs.voiceByLang[el.getAttribute('data-lang')] = el.getAttribute('data-voice');
        await savePrefs();
        if (App.player && App.plan) App.player.narratorVoiceId = el.getAttribute('data-voice');
        render();
        break;
      }
      case 'preview-voice': previewVoice(el.getAttribute('data-voice'), el.getAttribute('data-lang')); break;
      case 'test-voice': {
        /* Runs inside the tap so the mobile engine is unlocked by the gesture. */
        const lg = el.getAttribute('data-lang');
        const chosen = App.prefs.voiceByLang[lg];
        let heard = false;
        try {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance({
            'pt-BR': 'A voz está funcionando.',
            'de-DE': 'Die Stimme funktioniert.',
            'en-US': 'The voice is working.'
          }[lg] || 'The voice is working.');
          const v = FV.Voices.all().filter(function (x) { return x.id === chosen; })[0] || FV.Voices.pick(lg);
          if (v && v._native) u.voice = v._native;
          u.lang = (v && v.locale) || lg;
          u.onstart = function () { heard = true; };
          speechSynthesis.speak(u);
          setTimeout(function () {
            if (!heard) toast(t('voiceEngineSilent') + ' ' + t('voiceEngineSilentHelp'), 'warn');
          }, 3000);
        } catch (e) { toast(t('voiceEngineSilent'), 'warn'); }
        break;
      }
      case 'lab-one': previewVoice(el.getAttribute('data-voice'), null, (document.getElementById('fv-lab-text') || {}).value); break;
      case 'lab-run': await labRunAll(); break;

      case 'cast-set': break; // handled in onChange
      case 'cast-preview': previewCharacter(el.getAttribute('data-char')); break;
      case 'cast-lock': {
        const id = el.getAttribute('data-char');
        d.cast[id] = d.cast[id] || { archetype: 'narrator' };
        d.cast[id].locked = !d.cast[id].locked;
        await FV.Library.saveDocument(d); render();
        break;
      }
      case 'cast-narrator': {
        const id = el.getAttribute('data-char');
        d.cast[id] = { archetype: 'narrator', locked: true };
        await saveAndRebuild(); break;
      }
      case 'recast-all': {
        const blocks = FV.Importer.effectiveBlocks(d);
        const fresh = FV.suggestCasting(d.characters, blocks, d.language);
        for (const id in fresh) if (!(d.cast[id] && d.cast[id].locked)) d.cast[id] = fresh[id];
        await saveAndRebuild(); break;
      }
      case 'cast-merge': {
        const a = document.getElementById('fv-merge-a').value;
        const b = document.getElementById('fv-merge-b').value;
        if (a === b) break;
        const ca = d.characters.filter(function (c) { return c.id === a; })[0];
        const cb = d.characters.filter(function (c) { return c.id === b; })[0];
        if (!ca || !cb) break;
        ca.aliases = Array.from(new Set(ca.aliases.concat([cb.name], cb.aliases)));
        ca.mentions += cb.mentions;
        d.characters = d.characters.filter(function (c) { return c.id !== b; });
        delete d.cast[b];
        await saveAndRebuild(); break;
      }

      case 'ask-run': {
        const q = document.getElementById('fv-ask-q').value;
        App.params = { askQ: q, askResults: searchDocument(q) };
        render();
        break;
      }
      case 'jump-block': {
        const blockId = el.getAttribute('data-block');
        await openReader();
        const idx = App.player.segments.findIndex(function (s) { return s.blockId === blockId; });
        if (idx >= 0) { App.player.seekTo(idx); highlightSegment(App.player.currentSegment()); }
        break;
      }
      case 'jump-seg': {
        await openReader();
        const idx = indexOfSeg(el.getAttribute('data-seg'));
        App.player.seekTo(idx);
        break;
      }

      case 'bookmark-here': {
        const seg = App.player.currentSegment();
        if (!seg) break;
        await FV.Library.addBookmark({
          documentId: d.id, segmentId: seg.id, blockId: seg.blockId,
          label: currentChapterTitle() || d.title, text: seg.sourceText.slice(0, 120)
        });
        toast(t('addBookmark') + ' ✓', 'ok');
        break;
      }
      case 'note-here': {
        const seg = App.player.currentSegment();
        if (!seg) break;
        const body = prompt(t('noteHint'));
        if (!body) break;
        await FV.Library.addNote({ documentId: d.id, segmentId: seg.id, blockId: seg.blockId, body: body, quote: seg.sourceText.slice(0, 120) });
        toast(t('addNote') + ' ✓', 'ok');
        break;
      }
      case 'del-bookmark': await FV.Library.deleteBookmark(el.getAttribute('data-id')); App.params.bookmarks = await FV.Library.listBookmarks(d && d.id); render(); break;
      case 'del-note': await FV.Library.deleteNote(el.getAttribute('data-id')); App.params.notes = await FV.Library.listNotes(d && d.id); render(); break;

      case 'pron-add': {
        const from = document.getElementById('fv-pron-from').value.trim();
        const to = document.getElementById('fv-pron-to').value.trim();
        const scope = document.getElementById('fv-pron-scope').value;
        if (!from || !to) break;
        if (scope === 'book' && d) {
          d.dictionary = (d.dictionary || []).concat([{ from: from, to: to }]);
          await FV.Library.saveDocument(d);
        } else {
          const dict = await FV.Library.getDictionary();
          dict.push({ from: from, to: to });
          await FV.Library.saveDictionary(dict);
        }
        App.params.dict = await FV.Library.getDictionary();
        if (App.plan) await saveAndRebuild(); else render();
        break;
      }
      case 'pron-del': {
        const from = el.getAttribute('data-from');
        if (el.getAttribute('data-scope') === 'book' && d) {
          d.dictionary = (d.dictionary || []).filter(function (e) { return e.from !== from; });
          await FV.Library.saveDocument(d);
        } else {
          const dict = (await FV.Library.getDictionary()).filter(function (e) { return e.from !== from; });
          await FV.Library.saveDictionary(dict);
        }
        App.params.dict = await FV.Library.getDictionary();
        render();
        break;
      }
      case 'pron-test': previewVoice(null, d ? d.language : App.prefs.uiLang, el.getAttribute('data-from')); break;

      case 'set-theme': App.prefs.theme = el.getAttribute('data-theme'); await savePrefs(); applyTheme(); render(); break;
      case 'set-uilang': App.prefs.uiLang = el.getAttribute('data-lang'); FV.i18n.setLang(App.prefs.uiLang); await savePrefs(); render(); break;

      case 'rights-ok': App.params.rightsOk = el.checked; render(); break;
      case 'export-script': await exportScript(); break;
      case 'do-export': await exportData(); break;
      case 'delete-all':
        if (confirm(t('deleteAllBody'))) {
          App.player.stop();
          await FV.Store.clearAll();
          App.docs = []; App.doc = null; App.plan = null;
          App.prefs = await FV.Library.getPrefs();
          App.prefs.onboarded = true; App.prefs.mode = 'local';
          await savePrefs();
          App.stack = ['library']; App.view = 'library'; render();
          toast(t('done'), 'ok');
        }
        break;
      case 'test-server': {
        App.prefs.serverUrl = document.getElementById('fv-server').value.trim();
        App.prefs.serverToken = document.getElementById('fv-server-token').value.trim();
        await savePrefs();
        if (!App.prefs.serverUrl) {
          FV.Voices.setPremium([]);
          FV.Premium.status = null;
          toast(t('premiumNotConfigured'), 'warn');
          render();
          break;
        }
        const health = await connectPremium();
        if (health) {
          const n = FV.Voices.premium().length;
          toast(t('serverConnected') + (n ? ' · ' + n + ' ' + t('voices') : ''), 'ok');
        } else {
          toast(t('serverUnreachable') + (FV.Premium.lastError ? ': ' + FV.Premium.lastError.message : ''), 'warn');
        }
        render();
        break;
      }
      default: break;
    }
  }

  async function afterGo(view) {
    if (view === 'bookmarks') { App.params.bookmarks = await FV.Library.listBookmarks(App.doc && App.doc.id); render(); }
    if (view === 'notes') { App.params.notes = await FV.Library.listNotes(App.doc && App.doc.id); render(); }
    if (view === 'stats') { App.params.events = await FV.Library.listEvents(); render(); }
    if (view === 'pronunciation') { App.params.dict = await FV.Library.getDictionary(); render(); }
  }

  async function openReader() {
    if (!App.doc) return;
    App.doc.lastOpenedAt = Date.now();
    await FV.Library.saveDocument(App.doc);
    App.docs = await FV.Library.listDocuments();
    await buildPlanForCurrent();
    go('reader');
    await startPlayback();
  }

  async function saveAndRebuild() {
    const wasPlaying = App.player && App.player.playing;
    const idx = App.player ? App.player.index : 0;
    await FV.Library.saveDocument(App.doc);
    await buildPlanForCurrent();
    if (App.plan) {
      const settings = App.doc.settings || {};
      App.player.load(App.plan, {
        startIndex: Math.min(idx, App.plan.segments.length - 1),
        rate: App.prefs.speed || 1,
        narratorVoiceId: App.prefs.voiceByLang[settings.targetLang && settings.readingMode === 'translated' ? settings.targetLang : App.doc.language] || (FV.Voices.pick(App.doc.language) || {}).id,
        castVoices: resolveCastVoices(),
        targetLang: settings.targetLang || null,
        readingMode: settings.readingMode || 'original',
        translations: preloadTranslations(App.doc, settings.targetLang)
      });
      if (wasPlaying) App.player.play();
      scheduleTranslationAhead();
    }
    render();
  }

  function onChange(e) {
    const el = e.target;
    const action = el.getAttribute && el.getAttribute('data-action');
    if (!action) {
      if (el.id === 'fv-file' && el.files && el.files[0]) { const f = el.files[0]; el.value = ''; importFile(f); return; }
      if (/^fv-(images|images2|camera|camera2)$/.test(el.id) && el.files && el.files.length) {
        addImages(Array.from(el.files));
        el.value = '';   // allow photographing the same page again
        return;
      }
      return;
    }
    if (action === 'cast-set') {
      const id = el.getAttribute('data-char');
      App.doc.cast[id] = App.doc.cast[id] || {};
      App.doc.cast[id].archetype = el.value;
      saveAndRebuild();
    } else if (action === 'set-skip') {
      App.prefs.skip[el.getAttribute('data-skip')] = el.checked;
      savePrefs().then(function () { if (App.plan) saveAndRebuild(); });
    } else if (action === 'set-styleshift') {
      App.prefs.autoStyleShift = el.checked;
      savePrefs().then(function () { if (App.plan) saveAndRebuild(); });
    } else if (action === 'rights-ok') {
      App.params.rightsOk = el.checked;
      render();
    } else if (action === 'set-pref-num') {
      App.prefs[el.getAttribute('data-pref')] = parseInt(el.value, 10) || 1;
      savePrefs();
    }
  }

  function onInput(e) {
    const el = e.target;
    if (el.id === 'fv-q') {
      App.params = Object.assign({}, App.params, { q: el.value });
      const main = document.getElementById('app');
      const scroll = main ? main.scrollTop : 0;
      render();
      const q = document.getElementById('fv-q');
      if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
      return;
    }
    const action = el.getAttribute && el.getAttribute('data-action');
    if (action === 'set-fontscale') {
      App.prefs.fontScale = parseFloat(el.value);
      document.documentElement.style.setProperty('--fv-font-scale', String(App.prefs.fontScale));
      savePrefs();
    }
  }

  function onKey(e) {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if (e.key === ' ' && App.plan) { e.preventDefault(); App.player.toggle(); }
    else if (e.key === 'ArrowLeft' && App.plan) App.player.skipSeconds(-15);
    else if (e.key === 'ArrowRight' && App.plan) App.player.skipSeconds(15);
    else if (e.key === 'Escape') back();
  }

  /* ------------------------------------------------------------- previews */
  function previewVoice(voiceId, lang, customText) {
    if (typeof speechSynthesis === 'undefined') { toast(t('noVoicesBody'), 'warn'); return; }
    const v = voiceId ? FV.Voices.all().filter(function (x) { return x.id === voiceId; })[0] : FV.Voices.pick(lang);
    const text = customText || {
      'pt-BR': 'O moinho velho girava devagar sob a luz de uma estrela.',
      'de-DE': 'Der Mond kam hinter einer Wolke hervor und schien durch das Fenster.',
      'en-US': 'The old mill turned slowly under the light of a single star.'
    }[lang || (v && v.locale) || 'en-US'] || 'FolioVox. Every page deserves a voice.';
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (v && v._native) u.voice = v._native;
      u.lang = (v && v.locale) || lang || 'en-US';
      speechSynthesis.speak(u);
    } catch (e) { toast(t('errorBody'), 'warn'); }
  }

  function previewCharacter(charId) {
    const d = App.doc;
    const entry = (d.cast || {})[charId] || { archetype: 'narrator' };
    const resolved = FV.resolveCastVoice(entry.archetype, d.language, [], entry.voiceId);
    const c = d.characters.filter(function (x) { return x.id === charId; })[0];
    const blocks = FV.Importer.effectiveBlocks(d);
    let line = '';
    for (const b of blocks) {
      if (b.type === 'dialogue' && c && b.text.indexOf(c.name) >= 0) { line = b.text; break; }
    }
    if (!line && c) line = c.name + '.';
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(FV.toSpokenForm(line.slice(0, 180), d.language));
      const v = FV.Voices.all().filter(function (x) { return x.id === resolved.voiceId; })[0];
      if (v && v._native) u.voice = v._native;
      u.lang = d.language;
      u.pitch = Math.max(0, Math.min(2, resolved.pitch));
      u.rate = Math.max(0.1, Math.min(10, resolved.rate));
      speechSynthesis.speak(u);
    } catch (e) { toast(t('errorBody'), 'warn'); }
  }

  async function labRunAll() {
    const text = (document.getElementById('fv-lab-text') || {}).value || 'FolioVox';
    const lang = App.doc ? App.doc.language : App.prefs.uiLang;
    const list = FV.Voices.forLang(lang).slice(0, 6);
    for (const v of list) {
      await new Promise(function (resolve) {
        try {
          const u = new SpeechSynthesisUtterance(v.name + '. ' + text);
          if (v._native) u.voice = v._native;
          u.lang = v.locale;
          u.onend = resolve; u.onerror = resolve;
          speechSynthesis.speak(u);
        } catch (e) { resolve(); }
      });
    }
  }

  /* --------------------------------------------------------- page photos */
  async function addImages(files) {
    App.busy = { stage: 'stOrganizing', percent: 10 };
    if (App.view !== 'scanreview') { go('processing'); }
    for (let i = 0; i < files.length; i++) {
      const dataUrl = await blobToDataUrl(files[i]);
      App.busy = { stage: 'stOrganizing', percent: Math.round((i + 1) / files.length * 90) };
      renderProcessing();
      /* Straighten and flatten the lighting now: recognition works far better
         on a cropped, evened-out page than on a raw photograph. */
      let processed = dataUrl;
      try { processed = await preparePhoto(dataUrl); } catch (e) { /* keep the original */ }
      App.scan.pages.push({ id: 'p' + Date.now() + Math.random(), dataUrl: dataUrl, processedDataUrl: processed, rotation: 0 });
    }
    App.busy = null;
    App.scan.fileName = files[0] ? files[0].name : 'scan';
    App.scan.sourceHash = FV.hashString(App.scan.pages.map(function (p) { return p.dataUrl.length; }).join(','));
    if (App.view !== 'scanreview') replace('scanreview'); else render();
  }
  async function preparePhoto(dataUrl) {
    const img = new Image();
    await new Promise(function (res, rej) { img.onload = res; img.onerror = rej; img.src = dataUrl; });
    const c = document.createElement('canvas');
    c.width = img.naturalWidth || img.width;
    c.height = img.naturalHeight || img.height;
    if (!c.width || !c.height) return dataUrl;
    c.getContext('2d').drawImage(img, 0, 0);
    const cropped = FV.autoCropPage(c);
    FV.enhancePageImage(cropped);
    return cropped.toDataURL('image/jpeg', 0.9);
  }

  function moveScan(i, dir) {
    const p = App.scan.pages;
    const j = i + dir;
    if (j < 0 || j >= p.length) return;
    const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
    render();
  }
  async function transformScan(i, kind) {
    const page = App.scan.pages[i];
    if (!page) return;
    const img = new Image();
    await new Promise(function (r) { img.onload = r; img.onerror = r; img.src = page.processedDataUrl || page.dataUrl; });
    let c = document.createElement('canvas');
    c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    if (kind === 'rotate') c = FV.rotateCanvas(c, 90);
    else if (kind === 'enhance') FV.enhancePageImage(c);
    else if (kind === 'crop') c = FV.autoCropPage(c);
    page.processedDataUrl = c.toDataURL('image/jpeg', 0.9);
    render();
  }

  /** Render PDF pages to images is not possible without a PDF rasteriser, so
   *  scanned PDFs are handled by asking for page photographs instead. */
  async function ocrPdfPages() {
    toast({
      'pt-BR': 'Este PDF não traz texto. Fotografe as páginas ou envie as imagens: o reconhecimento funciona a partir de imagens.',
      'de-DE': 'Dieses PDF enthält keinen Text. Bitte die Seiten fotografieren oder Bilder senden: die Erkennung arbeitet mit Bildern.',
      'en-US': 'This PDF carries no text. Photograph the pages or add images: recognition works from images.'
    }[FV.i18n.lang], 'warn');
    App.scan = { pages: [], index: 0 };
    replace('add');
  }

  /* ------------------------------------------------------------- exports */
  /**
   * Hand a file to the user. When the page runs inside a host that mediates
   * saves, that path is used; a plain file or self-hosted copy falls back to
   * an object URL.
   */
  async function download(name, content, type) {
    try {
      if (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') {
        const downloads = await claude.use('downloads');
        if (downloads) {
          await downloads.save({ filename: name, data: content });
          return true;
        }
      }
    } catch (e) {
      if (e && e.code === 'declined') return false;
      /* fall through to the ordinary browser download */
    }
    try {
      const blob = new Blob([content], { type: type || 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return true;
    } catch (e) { toast(t('errorBody'), 'warn'); return false; }
  }

  function csvRow(cells) {
    return cells.map(function (c) {
      const s = String(c === undefined || c === null ? '' : c);
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }

  async function exportScript() {
    if (!App.plan) return;
    const header = csvRow(['id', 'chapter', 'page', 'type', 'speaker', 'emotion', 'intensity',
      'rate', 'pitch', 'pauseBefore', 'pauseAfter', 'spoken_aloud', 'source_text', 'spoken_text']);
    const rows = App.plan.segments.map(function (s) {
      const ch = App.doc.canonical.chapters.filter(function (c) { return c.id === s.chapter; })[0];
      return csvRow([s.id, ch ? ch.title : '', s.pageNumber || '', s.contentType,
      s.speaker || t('narrator'), s.emotion, s.intensity, s.rate.toFixed(2), s.pitch.toFixed(2),
      s.pauseBefore, s.pauseAfter, s.speak ? 'yes' : 'no', s.sourceText, s.spokenText]);
    });
    const name = (App.doc.title || 'foliovox').replace(/[^\p{L}\p{N} _-]/gu, '').slice(0, 60).trim() || 'foliovox';
    const saved = await download(name + ' - narration.csv', '﻿' + header + '\n' + rows.join('\n'), 'text/csv');
    if (saved) toast(t('done'), 'ok');
  }

  async function exportData() {
    const data = await FV.Library.exportAll();
    const saved = await download('foliovox-data.json', JSON.stringify(data, null, 2), 'application/json');
    if (saved) toast(t('done'), 'ok');
  }

  /* Guard: opening a picker from script is refused on mobile and inside
     embedded pages. If this ever returns true again, the add screen has
     regressed to the behaviour that silently did nothing. */
  const sourceHasScriptedPickerClick = /getElementById\(['"]fv-(file|images|images2|camera|camera2)['"]\)\s*\.click\(/.test(handle.toString());

  FV.appInternals = { sourceHasScriptedPickerClick: sourceHasScriptedPickerClick, searchDocument: searchDocument, esc: esc, fmtTime: fmtTime, importPastedText: importPastedText, openReader: openReader, buildPlanForCurrent: buildPlanForCurrent };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
(function () {
  function boot() {
    FV.App.start().catch(function (e) {
      document.getElementById('app').innerHTML =
        '<div style="padding:28px;font-family:system-ui">' +
        '<h2>FolioVox</h2><p>' + String(e && e.message || e) + '</p></div>';
      if (typeof console !== 'undefined') console.error(e);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
