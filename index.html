<!DOCTYPE html>

<head>
<meta charset="utf-8">

<meta name="description" content="FolioVox — import, scan, translate and listen to any book or document, with directed narration.">

<title>FolioVox</title>

<style>
/* FolioVox — styles.css — editorial, warm, accessible. REQ: R-42 */

:root {
  --fv-paper:#FBF7F0; --fv-paper-raised:#FFFFFF; --fv-paper-sunken:#F2EBE0;
  --fv-ink:#221C15; --fv-ink-soft:#5A5046; --fv-ink-faint:#8C8177; --fv-rule:#E2D8C9;
  --fv-accent:#8A5A2B; --fv-accent-soft:#F0E2D0; --fv-accent-ink:#FFFFFF;
  --fv-voice:#2F6F62; --fv-voice-soft:#DDEBE7; --fv-highlight:#FBE3A8;
  --fv-danger:#9B2C2C; --fv-danger-soft:#F7E3E3; --fv-warn:#8A6A12; --fv-warn-soft:#FAF0D4;
  --fv-ok:#2F6F3F; --fv-ok-soft:#E0EFE2;
  --fv-serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
  --fv-sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --fv-r-sm:8px; --fv-r-md:14px; --fv-r-lg:22px; --fv-r-pill:999px;
  --fv-font-scale:1;
  --fv-bar-h:84px; --fv-tabs-h:62px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fv-paper:#16130F; --fv-paper-raised:#1F1B16; --fv-paper-sunken:#100E0B;
    --fv-ink:#F2EAE0; --fv-ink-soft:#BDB2A5; --fv-ink-faint:#8A8076; --fv-rule:#332C24;
    --fv-accent:#D9A066; --fv-accent-soft:#3A2C1D; --fv-accent-ink:#16130F;
    --fv-voice:#7FC9B8; --fv-voice-soft:#1D2E2A; --fv-highlight:#4A3C14;
    --fv-danger:#E8A0A0; --fv-danger-soft:#3A1E1E; --fv-warn:#E0C176; --fv-warn-soft:#332A12;
    --fv-ok:#9BD1A6; --fv-ok-soft:#1E2E21;
  }
}
:root[data-theme="dark"] {
  --fv-paper:#16130F; --fv-paper-raised:#1F1B16; --fv-paper-sunken:#100E0B;
  --fv-ink:#F2EAE0; --fv-ink-soft:#BDB2A5; --fv-ink-faint:#8A8076; --fv-rule:#332C24;
  --fv-accent:#D9A066; --fv-accent-soft:#3A2C1D; --fv-accent-ink:#16130F;
  --fv-voice:#7FC9B8; --fv-voice-soft:#1D2E2A; --fv-highlight:#4A3C14;
  --fv-danger:#E8A0A0; --fv-danger-soft:#3A1E1E; --fv-warn:#E0C176; --fv-warn-soft:#332A12;
  --fv-ok:#9BD1A6; --fv-ok-soft:#1E2E21;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; }
body {
  background: var(--fv-paper); color: var(--fv-ink);
  font-family: var(--fv-sans);
  font-size: calc(16px * var(--fv-font-scale));
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
#app { min-height:100%; display:flex; flex-direction:column; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--fv-voice); outline-offset: 2px; border-radius: 4px; }

/* ------------------------------------------------------------- structure */
#fv-main, .fv-pad { padding: 0 16px; }
.fv-pad { padding-bottom: calc(var(--fv-bar-h) + var(--fv-tabs-h) + 24px); max-width: 780px; margin: 0 auto; width:100%; }
.fv-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index:20;
  display:flex; align-items:center; gap:8px;
  padding: 10px 8px; background: color-mix(in srgb, var(--fv-paper) 92%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--fv-rule);
}
.fv-head--main { padding: 14px 12px; }
.fv-head-title { font-family: var(--fv-serif); font-size: 1.12rem; font-weight:600; margin:0; flex:1; text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fv-head--main .fv-head-title { text-align:left; font-size:1.4rem; }
.fv-head-spacer { width:40px; display:inline-block; }
.fv-icon-btn {
  width:40px; height:40px; display:grid; place-items:center;
  border:none; background:transparent; border-radius: var(--fv-r-pill); color: var(--fv-ink-soft);
}
.fv-icon-btn:hover { background: var(--fv-paper-sunken); color: var(--fv-ink); }
.fv-icon-btn.is-on { color: var(--fv-accent); }

.fv-h2 { font-family: var(--fv-serif); font-size:1.5rem; margin: 18px 0 12px; }
.fv-h3 { font-family: var(--fv-serif); font-size:1.06rem; margin: 26px 0 10px; color: var(--fv-ink-soft); letter-spacing:.01em; }
.fv-hint { color: var(--fv-ink-soft); margin: 8px 0 16px; }
.fv-fine { color: var(--fv-ink-faint); font-size:.86rem; margin: 14px 0; }
.fv-meta { color: var(--fv-ink-soft); font-size:.88rem; margin: 3px 0; }
.fv-link { background:none; border:none; color: var(--fv-voice); text-decoration: underline; padding:0; }

/* ------------------------------------------------------------- branding */
.fv-wordmark { display:inline-flex; align-items:center; gap:9px; }
.fv-wordmark-text { font-family: var(--fv-serif); font-size:1.32rem; font-weight:600; letter-spacing:-.01em; }
.fv-wordmark-text em { font-style:normal; color: var(--fv-voice); }
.fv-brandline { padding: 6px 0; display:flex; align-items:center; flex:1; }

.fv-splash { flex:1; display:grid; place-content:center; justify-items:center; gap:6px; text-align:center; padding:40px; }
.fv-splash-name { font-family: var(--fv-serif); font-size:2.4rem; margin:.3em 0 0; font-weight:600; }
.fv-splash-name em { font-style:normal; color: var(--fv-voice); }
.fv-splash-tag { color: var(--fv-ink-soft); margin:0; }
.fv-splash-wave { margin-top:18px; opacity:.85; }

/* ------------------------------------------------------------ onboarding */
.fv-onboard { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding: 32px 24px calc(var(--fv-bar-h) + 24px); max-width:560px; margin:0 auto; }
.fv-onboard-art { width:100%; max-width:300px; opacity:.9; }
.fv-onboard h2 { font-family: var(--fv-serif); font-size:1.6rem; margin:18px 0 8px; }
.fv-onboard p { color: var(--fv-ink-soft); margin:0 0 20px; }
.fv-dots { display:flex; gap:7px; margin-bottom:22px; }
.fv-dots span { width:8px; height:8px; border-radius:50%; background: var(--fv-rule); }
.fv-dots span.on { background: var(--fv-voice); width:22px; border-radius: var(--fv-r-pill); }
.fv-onboard-actions { display:flex; flex-direction:column; gap:8px; width:100%; max-width:320px; }

/* ---------------------------------------------------------------- atoms */
.fv-btn {
  border:1px solid transparent; border-radius: var(--fv-r-pill);
  padding: 12px 22px; font-weight:600; font-size:.97rem;
  background: var(--fv-paper-sunken); color: var(--fv-ink);
  min-height:46px; transition: transform .08s ease, background .15s ease;
}
.fv-btn:active { transform: scale(.985); }
.fv-btn--primary { background: var(--fv-accent); color: var(--fv-accent-ink); }
.fv-btn--ghost { background: transparent; border-color: var(--fv-rule); color: var(--fv-ink-soft); }
.fv-btn--danger { background: var(--fv-danger-soft); color: var(--fv-danger); border-color: transparent; }
.fv-btn--wide { display:block; width:100%; margin:14px 0; }
.fv-btn[disabled] { opacity:.45; pointer-events:none; }

.fv-input {
  width:100%; padding: 12px 14px; border-radius: var(--fv-r-md);
  border:1px solid var(--fv-rule); background: var(--fv-paper-raised); color: var(--fv-ink);
  font: inherit; margin: 6px 0 14px;
}
.fv-input--num { width:100px; margin:0; }
.fv-textarea { font-family: var(--fv-serif); line-height:1.6; resize: vertical; }
.fv-label { display:block; font-size:.88rem; color: var(--fv-ink-soft); margin-top:10px; }
.fv-select { padding:9px 10px; border-radius: var(--fv-r-sm); border:1px solid var(--fv-rule);
  background: var(--fv-paper-raised); color: var(--fv-ink); font:inherit; max-width:100%; }
.fv-range { width:100%; accent-color: var(--fv-voice); }
.fv-field { display:flex; align-items:center; gap:12px; justify-content:space-between;
  padding:12px 0; border-bottom:1px solid var(--fv-rule); }
.fv-field > span { flex:1; }
.fv-check { display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--fv-rule); }
.fv-check input { width:20px; height:20px; accent-color: var(--fv-voice); margin-top:2px; flex:none; }

.fv-chips { display:flex; flex-wrap:wrap; gap:8px; margin: 6px 0 12px; }
.fv-chip {
  border:1px solid var(--fv-rule); background: var(--fv-paper-raised); color: var(--fv-ink-soft);
  border-radius: var(--fv-r-pill); padding: 8px 15px; font-size:.88rem; min-height:38px;
}
.fv-chip.is-on { background: var(--fv-voice); color: var(--fv-paper); border-color: var(--fv-voice); font-weight:600; }
.fv-chip--tiny { padding:5px 10px; min-height:30px; font-size:.8rem; }
.fv-mini { border:1px solid var(--fv-rule); background: var(--fv-paper-raised); color: var(--fv-ink-soft);
  border-radius: var(--fv-r-sm); padding:6px 10px; font-size:.8rem; min-height:34px; }
.fv-mini.is-on { background: var(--fv-accent-soft); color: var(--fv-accent); border-color: var(--fv-accent); }
.fv-mini--danger { color: var(--fv-danger); }

.fv-badge { display:inline-block; font-size:.74rem; padding:3px 9px; border-radius: var(--fv-r-pill);
  background: var(--fv-paper-sunken); color: var(--fv-ink-soft); font-weight:600; }
.fv-badge--ok { background: var(--fv-ok-soft); color: var(--fv-ok); }
.fv-badge--warn { background: var(--fv-warn-soft); color: var(--fv-warn); }

.fv-note { background: var(--fv-paper-raised); border:1px solid var(--fv-rule);
  border-radius: var(--fv-r-md); padding: 13px 15px; margin: 12px 0; color: var(--fv-ink-soft); }
.fv-note--warn { background: var(--fv-warn-soft); border-color: transparent; color: var(--fv-warn); }
.fv-note--danger { background: var(--fv-danger-soft); border-color: transparent; color: var(--fv-danger); }
.fv-note--ok { background: var(--fv-ok-soft); border-color: transparent; color: var(--fv-ok); }

.fv-bar { display:block; height:5px; background: var(--fv-paper-sunken); border-radius: var(--fv-r-pill); overflow:hidden; margin-top:6px; }
.fv-bar i { display:block; height:100%; background: var(--fv-voice); border-radius: var(--fv-r-pill); transition: width .3s ease; }
.fv-bar--big { height:9px; margin:10px 0; }


/* File inputs stay in the layout but invisible: a display:none input cannot be
   opened by its label on some mobile browsers. */
.fv-file-input {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.fv-card--file, .fv-btn--label, .fv-icon-btn--label { cursor: pointer; }
.fv-btn--label { display: block; text-align: center; }
.fv-icon-btn--label { display: grid; place-items: center; }
.fv-file-input:focus-visible + *,
.fv-file-input:focus-visible ~ .fv-card--file { outline: 3px solid var(--fv-voice); outline-offset: 2px; }
.fv-card--file:active, .fv-btn--label:active { transform: scale(.995); }

.fv-hostbanner { border-left: 4px solid var(--fv-warn); }

/* --------------------------------------------------------------- cards  */
.fv-card { display:block; width:100%; text-align:left; border:1px solid var(--fv-rule);
  background: var(--fv-paper-raised); border-radius: var(--fv-r-lg); padding:18px; margin:12px 0; }
.fv-card h3 { font-family: var(--fv-serif); margin:8px 0 6px; font-size:1.2rem; }
.fv-card p { margin:0; color: var(--fv-ink-soft); font-size:.92rem; }
.fv-card .fv-cta { display:inline-block; margin-top:12px; color: var(--fv-voice); font-weight:600; font-size:.92rem; }
.fv-card--row { display:flex; align-items:center; gap:14px; padding:16px; }
.fv-card--row span:nth-child(2) { flex:1; display:flex; flex-direction:column; }
.fv-card--row strong { font-size:1rem; }
.fv-card--row small { color: var(--fv-ink-soft); font-size:.86rem; }
.fv-card-ic { width:42px; height:42px; flex:none; border-radius: var(--fv-r-md);
  background: var(--fv-voice-soft); color: var(--fv-voice); display:grid; place-items:center; }
.fv-card-arrow { color: var(--fv-ink-faint); }

.fv-searchrow { position:relative; }
.fv-search { padding-left:40px; }
.fv-search-ic { position:absolute; left:12px; top:17px; color: var(--fv-ink-faint); pointer-events:none; }

/* -------------------------------------------------------------- library */
.fv-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(124px,1fr)); gap:16px; }
.fv-book { border:none; background:none; padding:0; text-align:left; display:flex; flex-direction:column; gap:5px; }
.fv-book-title { font-family: var(--fv-serif); font-size:.97rem; font-weight:600; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.fv-book-sub { color: var(--fv-ink-faint); font-size:.78rem; }
.fv-cover { display:grid; place-items:center; border-radius: var(--fv-r-md); overflow:hidden;
  background: linear-gradient(150deg, hsl(var(--h,30) 32% 62%), hsl(var(--h,30) 30% 42%));
  color:#fff; font-family: var(--fv-serif); box-shadow: 0 2px 10px rgba(0,0,0,.14); }
.fv-cover img { width:100%; height:100%; object-fit:cover; }
.fv-cover--sm { width:52px; height:70px; font-size:1.3rem; flex:none; }
.fv-cover--md { width:100%; aspect-ratio: 3/4; font-size:2rem; }
.fv-cover--lg { width:96px; height:128px; font-size:2.4rem; flex:none; }

.fv-continue { display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  background: var(--fv-paper-raised); border:1px solid var(--fv-rule); border-radius: var(--fv-r-lg); padding:12px; }
.fv-continue-meta { flex:1; display:flex; flex-direction:column; gap:2px; min-width:0; }
.fv-continue-meta strong { font-family: var(--fv-serif); }
.fv-continue-meta small { color: var(--fv-ink-faint); font-size:.82rem; }
.fv-continue-play { width:44px; height:44px; flex:none; border-radius:50%;
  background: var(--fv-accent); color: var(--fv-accent-ink); display:grid; place-items:center; }

.fv-empty { text-align:center; padding: 26px 16px; color: var(--fv-ink-soft); }
.fv-empty h4 { font-family: var(--fv-serif); font-size:1.15rem; margin:14px 0 6px; color: var(--fv-ink); }
.fv-empty p { margin:0 0 18px; }

/* ----------------------------------------------------------------- book */
.fv-bookhead { display:flex; gap:16px; align-items:flex-start; margin:16px 0; }
.fv-booktitle { font-family: var(--fv-serif); font-size:1.4rem; margin:0 0 4px; line-height:1.25; }
.fv-bookauthor { color: var(--fv-ink-soft); margin:0 0 8px; }
.fv-tiles { display:grid; grid-template-columns: repeat(auto-fill, minmax(92px,1fr)); gap:10px; margin:16px 0; }
.fv-tile { display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 8px;
  border:1px solid var(--fv-rule); border-radius: var(--fv-r-md); background: var(--fv-paper-raised); color: var(--fv-ink-soft); }
.fv-tile small { font-size:.76rem; text-align:center; line-height:1.25; }
.fv-tile span { color: var(--fv-voice); }
.fv-chapters { margin:0; padding-left:20px; }
.fv-chapters li { margin:4px 0; }
.fv-chapters button { background:none; border:none; padding:6px 0; text-align:left; color: var(--fv-ink);
  font-family: var(--fv-serif); }
.fv-chapters button:hover { color: var(--fv-voice); }

/* --------------------------------------------------------------- reader */
.fv-readerbar { position:sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index:15; display:flex; gap:8px; overflow-x:auto;
  padding:10px 16px; background: color-mix(in srgb, var(--fv-paper) 94%, transparent);
  backdrop-filter: blur(8px); border-bottom:1px solid var(--fv-rule); scrollbar-width:none; }
.fv-readerbar::-webkit-scrollbar { display:none; }
.fv-reader { max-width: 720px; margin:0 auto; padding: 18px 18px calc(var(--fv-bar-h) + var(--fv-tabs-h) + 30px);
  font-family: var(--fv-serif); font-size: 1.09rem; line-height:1.75; }
.fv-block { margin: 0 0 1.05em; }
.fv-block--heading { font-size:1.35rem; font-weight:600; margin:1.8em 0 .7em; line-height:1.3; }
.fv-block--dialogue { padding-left: .6em; }
.fv-block--quote { border-left:3px solid var(--fv-accent-soft); padding-left:14px; color: var(--fv-ink-soft); font-style:italic; }
.fv-block--footnote { font-size:.9rem; color: var(--fv-ink-faint); }
.fv-block--list { padding-left:.4em; }
.fv-block--translation { color: var(--fv-voice); font-size:.99rem; border-left:2px dashed var(--fv-voice-soft);
  padding-left:12px; margin-top:-.4em; }
.fv-seg { border-radius:4px; padding: 1px 0; transition: background .18s ease; cursor:pointer; }
.fv-seg:hover { background: var(--fv-paper-sunken); }
.fv-seg.is-active { background: var(--fv-highlight); box-shadow: 0 0 0 3px var(--fv-highlight); }
.fv-word { background: var(--fv-voice); color: var(--fv-paper); border-radius:3px; padding:0 1px; }
.fv-trans.is-pending { opacity:.5; font-style:italic; }
.fv-trans.is-failed { color: var(--fv-warn); }
.fv-reader.is-split .fv-block--translation { background: var(--fv-paper-raised); border-radius: var(--fv-r-sm); padding:10px 12px; }

/* --------------------------------------------------------- player + tabs */
.fv-playerbar {
  position:fixed; left:0; right:0; bottom: var(--fv-tabs-h); z-index:30;
  background: color-mix(in srgb, var(--fv-paper-raised) 96%, transparent);
  backdrop-filter: blur(14px); border-top:1px solid var(--fv-rule);
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.fv-pb-progress { height:3px; background: var(--fv-paper-sunken); }
.fv-pb-progress i { display:block; height:100%; background: var(--fv-voice); transition: width .4s linear; }
.fv-pb-row { display:flex; align-items:center; gap:10px; padding:8px 14px; max-width:900px; margin:0 auto; }
.fv-pb-now { flex:1; min-width:0; display:flex; flex-direction:column; }
.fv-pb-now strong { font-family: var(--fv-serif); font-size:.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fv-pb-now small { color: var(--fv-ink-faint); font-size:.76rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fv-pb-controls { display:flex; align-items:center; gap:2px; }
.fv-play { width:52px; height:52px; border:none; border-radius:50%; background: var(--fv-accent);
  color: var(--fv-accent-ink); display:grid; place-items:center; flex:none; box-shadow:0 3px 12px rgba(0,0,0,.18); }
.fv-pb-side { display:flex; align-items:center; gap:6px; }
.fv-time { font-size:.74rem; color: var(--fv-ink-faint); font-variant-numeric: tabular-nums; white-space:nowrap; }

.fv-tabs { position:fixed; left:0; right:0; bottom:0; z-index:31; height: var(--fv-tabs-h);
  display:grid; grid-template-columns: repeat(4,1fr);
  background: var(--fv-paper-raised); border-top:1px solid var(--fv-rule);
  padding-bottom: env(safe-area-inset-bottom, 0); }
.fv-tab { border:none; background:none; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:2px; color: var(--fv-ink-faint); }
.fv-tab small { font-size:.68rem; }
.fv-tab.is-on { color: var(--fv-voice); }

/* ------------------------------------------------------------ list items */
.fv-listitem { display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--fv-rule); }
.fv-listitem > button:first-child { flex:1; display:flex; flex-direction:column; align-items:flex-start;
  gap:2px; background:none; border:none; padding:14px 0; text-align:left; min-width:0; }
.fv-listitem strong { font-size:.96rem; }
.fv-listitem small { color: var(--fv-ink-faint); font-size:.82rem;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* FolioVox — store.js
 * Local-first persistence. IndexedDB when available, localStorage next,
 * memory last — every path is wrapped so a blocked storage API degrades
 * instead of breaking the app.
 * REQ: R-6.1 (local mode), R-35 (progress survives restart), R-44 (data model),
 *      R-45 (deletion & export)
 */
(function (root) {
  'use strict';
  const FV = root.FV || (root.FV = {});

  const DB_NAME = 'foliovox';
  const DB_VERSION = 1;
  const STORES = ['documents', 'assets', 'progress', 'bookmarks', 'notes', 'prefs', 'cache', 'events'];

  let db = null;
  let backend = 'memory';
  const mem = {};
  STORES.forEach(function (s) { mem[s] = new Map(); });

  function lsKey(store, key) { return 'fv.' + store + '.' + key; }

  function openDB() {
    return new Promise(function (resolve) {
      if (typeof indexedDB === 'undefined') return resolve(null);
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (e) { return resolve(null); }
      req.onupgradeneeded = function () {
        const d = req.result;
        STORES.forEach(function (s) { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(null); };
      req.onblocked = function () { resolve(null); };
      setTimeout(function () { resolve(req.result || null); }, 3000);
    });
  }

  const Store = {
    ready: false,
    backend: function () { return backend; },

    init: async function () {
      db = await openDB();
      if (db) backend = 'indexeddb';
      else {
        try {
          localStorage.setItem('fv.probe', '1');
          localStorage.removeItem('fv.probe');
          backend = 'localstorage';
        } catch (e) { backend = 'memory'; }
      }
      Store.ready = true;
      return backend;
    },

    get: async function (store, key) {
      try {
        if (backend === 'indexeddb' && db) {
          return await new Promise(function (resolve) {
            const tx = db.transaction(store, 'readonly');
            const r = tx.objectStore(store).get(key);
            r.onsuccess = function () { resolve(r.result === undefined ? null : r.result); };
            r.onerror = function () { resolve(null); };
          });
        }
        if (backend === 'localstorage') {
          const v = localStorage.getItem(lsKey(store, key));
          return v === null ? null : JSON.parse(v);
        }
      } catch (e) { /* fall through */ }
      const m = mem[store];
      return m && m.has(key) ? m.get(key) : null;
    },

    set: async function (store, key, value) {
      if (mem[store]) mem[store].set(key, value);
      try {
        if (backend === 'indexeddb' && db) {
          return await new Promise(function (resolve, reject) {
            const tx = db.transaction(store, 'readwrite');
            tx.objectStore(store).put(value, key);
            tx.oncomplete = function () { resolve(true); };
            tx.onerror = function () { resolve(false); };
            tx.onabort = function () { resolve(false); };
          });
        }
        if (backend === 'localstorage') {
          localStorage.setItem(lsKey(store, key), JSON.stringify(value));
          return true;
        }
      } catch (e) { /* quota or blocked — memory copy already kept */ }
      return false;
    },

    del: async function (store, key) {
      if (mem[store]) mem[store].delete(key);
      try {
        if (backend === 'indexeddb' && db) {
          return await new Promise(function (resolve) {
            const tx = db.transaction(store, 'readwrite');
            tx.objectStore(store).delete(key);
            tx.oncomplete = function () { resolve(true); };
            tx.onerror = function () { resolve(false); };
          });
        }
        if (backend === 'localstorage') { localStorage.removeItem(lsKey(store, key)); return true; }
      } catch (e) { /* ignore */ }
      return false;
    },

    keys: async function (store) {
      try {
        if (backend === 'indexeddb' && db) {
          return await new Promise(function (resolve) {
            const tx = db.transaction(store, 'readonly');
            const r = tx.objectStore(store).getAllKeys();
            r.onsuccess = function () { resolve(r.result || []); };
            r.onerror = function () { resolve([]); };
          });
        }
        if (backend === 'localstorage') {
          const out = [];
          const prefix = 'fv.' + store + '.';
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.indexOf(prefix) === 0) out.push(k.slice(prefix.length));
          }
          return out;
        }
      } catch (e) { /* ignore */ }
      return Array.from((mem[store] || new Map()).keys());
    },

    all: async function (store) {
      const ks = await Store.keys(store);
      const out = [];
      for (const k of ks) {
        const v = await Store.get(store, k);
        if (v) out.push(v);
      }
      return out;
    },

    clearAll: async function () {
      for (const s of STORES) {
        const ks = await Store.keys(s);
        for (const k of ks) await Store.del(s, k);
        if (mem[s]) mem[s].clear();
      }
    }
  };

  /* --------------------------------------------------------- domain layer */
  const Library = {
    /** Persist a document. Layers stay separate: canonical text is never
     *  overwritten by corrections or translations. */
    saveDocument: async function (doc) {
      doc.updatedAt = Date.now();
      await Store.set('documents', doc.id, doc);
      return doc;
    },
    getDocument: function (id) { return Store.get('documents', id); },
    listDocuments: async function () {
      const docs = await Store.all('documents');
      docs.sort(function (a, b) { return (b.lastOpenedAt || b.addedAt || 0) - (a.lastOpenedAt || a.addedAt || 0); });
      return docs;
    },
    deleteDocument: async function (id) {
      await Store.del('documents', id);
      await Store.del('progress', id);
      await Store.del('assets', id);
      const bms = await Store.all('bookmarks');
      for (const b of bms) if (b.documentId === id) await Store.del('bookmarks', b.id);
      const ns = await Store.all('notes');
      for (const n of ns) if (n.documentId === id) await Store.del('notes', n.id);
    },
    findByHash: async function (hash) {
      const docs = await Store.all('documents');
      for (const d of docs) if (d.sourceHash === hash) return d;
      return null;
    },

    saveProgress: function (documentId, p) {
      p.updatedAt = Date.now();
      return Store.set('progress', documentId, p);
    },
    getProgress: function (documentId) { return Store.get('progress', documentId); },

    addBookmark: async function (bm) {
      bm.id = bm.id || 'bm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      bm.createdAt = Date.now();
      await Store.set('bookmarks', bm.id, bm);
      return bm;
    },
    listBookmarks: async function (documentId) {
      const all = await Store.all('bookmarks');
      return all.filter(function (b) { return !documentId || b.documentId === documentId; })
        .sort(function (a, b) { return b.createdAt - a.createdAt; });
    },
    deleteBookmark: function (id) { return Store.del('bookmarks', id); },

    addNote: async function (n) {
      n.id = n.id || 'nt_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      n.createdAt = n.createdAt || Date.now();
      await Store.set('notes', n.id, n);
      return n;
    },
    listNotes: async function (documentId) {
      const all = await Store.all('notes');
      return all.filter(function (n) { return !documentId || n.documentId === documentId; })
        .sort(function (a, b) { return b.createdAt - a.createdAt; });
    },
    deleteNote: function (id) { return Store.del('notes', id); },

    getPrefs: async function () {
      const p = await Store.get('prefs', 'main');
      return Object.assign({
        uiLang: null, theme: 'auto', fontScale: 1,
        defaultTargetLang: null, readingMode: 'original',
        experience: 'auto', style: 'auto', speed: 1,
        voiceByLang: {}, skip: { footnotes: false, citations: false, pageNumbers: true, bibliography: false, tables: false, formulas: false },
        autoStyleShift: true, childIntensity: 0.7, onboarded: false, mode: null,
        serverUrl: '', serverToken: '', dailyGoalMinutes: 15, weeklyGoalMinutes: 90,
        translationProvider: 'auto', translationEmail: ''
      }, p || {});
    },
    savePrefs: function (p) { return Store.set('prefs', 'main', p); },

    getDictionary: async function () { return (await Store.get('prefs', 'dictionary')) || []; },
    saveDictionary: function (d) { return Store.set('prefs', 'dictionary', d); },

    /* Translation and narration caches keyed by content hash so nothing is
       paid for or computed twice. */
    cacheGet: function (key) { return Store.get('cache', key); },
    cacheSet: function (key, value) { return Store.set('cache', key, value); },

    /** Daily listening events drive goals, streaks and statistics. */
    recordListening: async function (seconds, documentId) {
      const day = new Date().toISOString().slice(0, 10);
      const e = (await Store.get('events', day)) || { day: day, seconds: 0, documents: {} };
      e.seconds += seconds;
      e.documents[documentId] = (e.documents[documentId] || 0) + seconds;
      await Store.set('events', day, e);
      return e;
    },
    listEvents: function () { return Store.all('events'); },

    exportAll: async function () {
      const out = { app: 'FolioVox', exportedAt: new Date().toISOString(), version: 1, data: {} };
      for (const s of STORES) {
        if (s === 'assets' || s === 'cache') continue;
        out.data[s] = await Store.all(s);
      }
      return out;
    }
  };

  FV.Store = Store;
  FV.Library = Library;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* FolioVox — premium.js
 * Talks to the FolioVox server for neural narration, contextual translation
 * and advanced OCR. The server holds the provider credentials; this file never
 * sees one. The only secret it stores is the access token for the owner's own
 * server, which the owner sets once.
 * REQ: R-6.9, R-18 (audiobook quality), R-33 (providers), R-46 (cost control)
 */
(function (root) {
  'use strict';
  const FV = root.FV || (root.FV = {});

  const Premium = {
    serverUrl: '',
    token: '',
    status: null,       // last /health payload
    voices: [],
    lastError: null,

    configured: function () { return !!Premium.serverUrl; },

    _url: function (p) { return Premium.serverUrl.replace(/\/+$/, '') + p; },
    _headers: function (extra) {
      const h = Object.assign({}, extra || {});
      if (Premium.token) h['Authorization'] = 'Bearer ' + Premium.token;
      return h;
    },

    /** Ask the server what it can do. Never throws; returns null on failure. */
    check: async function (url, token) {
      const base = (url !== undefined ? url : Premium.serverUrl || '').replace(/\/+$/, '');
      if (!base) { Premium.status = null; return null; }
      try {
        const res = await fetch(base + '/health', { method: 'GET' });
        if (!res.ok) throw new Error('server returned ' + res.status);
        const json = await res.json();
        if (!json || json.service !== 'foliovox-api') throw new Error('not a FolioVox server');
        Premium.status = json;
        Premium.lastError = null;
        return json;
      } catch (e) {
        Premium.status = null;
        Premium.lastError = e;
        return null;
      }
    },

    loadVoices: async function () {
      if (!Premium.configured()) { Premium.voices = []; return []; }
      try {
        const res = await fetch(Premium._url('/v1/voices'), { headers: Premium._headers() });
        if (!res.ok) throw new Error('voices request returned ' + res.status);
        const json = await res.json();
        Premium.voices = (json.voices || []).map(function (v) {
          return {
            id: 'premium:' + v.provider + ':' + v.voiceId,
            provider: v.provider,
            voiceId: v.voiceId,
            name: v.name,
            rawName: v.name,
            locale: v.locale || 'multilingual',
            gender: v.gender || 'unknown',
            localService: false,
            premium: true,
            styles: v.styles || [],
            streaming: false,
            timestamps: false,
            pronunciationControls: v.provider === 'azure',
            commercialUse: v.commercialUse || 'per provider terms',
            description: v.description || ''
          };
        });
        return Premium.voices;
      } catch (e) {
        Premium.lastError = e;
        Premium.voices = [];
        return [];
      }
    },

    /**
     * Narrate one segment. The whole narration direction goes to the server,
     * which maps it onto whatever the chosen provider actually supports.
     * Returns an object URL for an audio file.
     */
    synthesize: async function (segment, voice, lang) {
      if (!Premium.configured()) { const e = new Error('PREMIUM_NOT_CONFIGURED'); e.code = 'PREMIUM_NOT_CONFIGURED'; throw e; }
      const payload = {
        text: segment.spokenText,
        lang: lang || segment.lang,
        voiceId: voice ? voice.voiceId : '',
        rate: segment.rate,
        pitch: segment.pitch,
        volume: segment.volume,
        emotion: segment.emotion,
        intensity: segment.intensity,
        style: segment.style,
        contentType: segment.contentType,
        speaker: segment.speaker || ''
      };
      /* Exposed so tests can assert that the narration direction travels with
         the text; it holds no credentials. */
      if (typeof window !== 'undefined') window.__fvLastTtsBody = payload;
      const res = await fetch(Premium._url('/v1/tts'), {
        method: 'POST',
        headers: Premium._headers({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        let code = 'PROVIDER_ERROR', message = 'server returned ' + res.status;
        try {
          const j = await res.json();
          if (j && j.error) { code = j.error.code || code; message = j.error.message || message; }
        } catch (e) { /* non-JSON error body */ }
        const err = new Error(message);
        err.code = code;
        err.status = res.status;
        throw err;
      }
      const blob = await res.blob();
      return URL.createObjectURL(blob);
    },

    translate: async function (text, from, to, glossary) {
      const res = await fetch(Premium._url('/v1/translate'), {
        method: 'POST',
        headers: Premium._headers({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ text: text, from: from, to: to, glossary: glossary || [] })
      });
      if (!res.ok) throw new Error('translation failed (' + res.status + ')');
      const json = await res.json();
      return json.text;
    },

    ocr: async function (image, langs) {
      const res = await fetch(Premium._url('/v1/ocr'), {
        method: 'POST',
        headers: Premium._headers({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ image: image, langs: langs || [] })
      });
      if (!res.ok) throw new Error('OCR failed (' + res.status + ')');
      return await res.json();
    },

    usage: async function () {
      try {
        const res = await fetch(Premium._url('/v1/usage'), { headers: Premium._headers() });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) { return null; }

  function highlightWord(info) {
    const el = document.querySelector('[data-seg="' + info.segment.id + '"]');
    if (!el) return;
    const full = el.getAttribute('data-full') || el.textContent;
    const start = info.charIndex;
    if (start < 0 || start > full.length) return;
    let end = info.charLength ? start + info.charLength : full.indexOf(' ', start);
    if (end <= start) end = full.length;
    el.innerHTML = esc(full.slice(0, start)) + '<mark class="fv-word">' + esc(full.slice(start, end)) + '</mark>' + esc(full.slice(end));
  }

  /* --------------------------------------------------- translation ahead */
  let translateQueue = [];
  let translating = false;
  function scheduleTranslationAhead() {
    if (!App.player || !App.doc) return;
    const mode = App.player.readingMode;
    if (mode !== 'translated' && mode !== 'bilingual' && mode !== 'sidebyside') return;
    const target = App.player.targetLang;
    if (!target) return;
    const segs = App.player.segments;
    for (let i = App.player.index; i < Math.min(segs.length, App.player.index + 4); i++) {
      const s = segs[i];
      if (App.player.translations[s.id] || App.player.translationState[s.id]) continue;
      App.player.translationState[s.id] = 'pending';
      translateQueue.push(s);
    }
    pumpTranslation();
  }

  async function pumpTranslation() {
    if (translating) return;
    translating = true;
    while (translateQueue.length) {
      const seg = translateQueue.shift();
      if (!App.player) break;
      const target = App.player.targetLang;
      try {
        const glossary = FV.Translator.buildGlossary(App.doc ? App.doc.characters : [], []);
        const viaServer = FV.Premium.status && FV.Premium.status.selected && FV.Premium.status.selected.translate;
        const out = viaServer
          ? await FV.Premium.translate(seg.sourceText, seg.lang, target,
              FV.Translator.buildGlossary(App.doc ? App.doc.characters : [], []))
          : await FV.Translator.translateParagraph(seg.sourceText, seg.lang, target, {
          provider: App.prefs.translationProvider || 'auto',
          email: App.prefs.translationEmail || '',
          serverUrl: App.prefs.serverUrl || '',
          glossary: glossary
        });
        App.player.translations[seg.id] = FV.toSpokenForm(out, target, await FV.Library.getDictionary());
        App.player.translationState[seg.id] = 'ready';
        cacheDocTranslation(seg, out, target);
        const el = document.querySelector('[data-trans="' + seg.id + '"]');
        if (el) { el.textContent = out; el.classList.remove('is-pending'); }
      } catch (e) {
        App.player.translationState[seg.id] = 'failed';
        const el = document.querySelector('[data-trans="' + seg.id + '"]');
        if (el) { el.textContent = e.code === 'OFFLINE' ? t('translationNeedsNet') : t('translationFailed'); el.classList.add('is-failed'); }
        if (!pumpTranslation._warned) {
          pumpTranslation._warned = true;
          toast(e.code === 'OFFLINE' ? t('translationNeedsNet') : t('translationFailed'), 'warn');
        }
        await new Promise(function (r) { setTimeout(r, 800); });
      }
    }
    translating = false;
  }

  async function cacheDocTranslation(seg, text, target) {
    if (!App.doc) return;
    App.doc.translations[target] = App.doc.translations[target] || {};
    App.doc.translations[target][seg.id] = text;
    if (!cacheDocTranslation._t) {
      cacheDocTranslation._t = setTimeout(function () {
        cacheDocTranslation._t = null;
        FV.Library.saveDocument(App.doc);
      }, 3000);
    }
  }

  /* -------------------------------------------------------------- import */
  async function importFile(file) {
    App.busy = { stage: 'stReading', percent: 2, name: file.name };
    go('processing');
    try {
      const buf = new Uint8Array(await file.arrayBuffer());
      const hash = FV.hashString(file.name + ':' + buf.length + ':' + Array.from(buf.slice(0, 2048)).join(','));
      const dup = await FV.Library.findByHash(hash);
      if (dup) { toast(t('duplicateFile'), 'warn'); App.busy = null; replace('book', { id: dup.id }); App.doc = dup; return; }

      const parsed = await FV.Importer.parse(buf, file.name, function (p) {
        App.busy = Object.assign({}, App.busy, p);
        renderProcessing();
      });

      if (parsed.needsOcr) {
        if (parsed.kind === 'image') {
          const dataUrl = await blobToDataUrl(file);
          App.scan = { pages: [{ id: 'p0', dataUrl: dataUrl, rotation: 0 }], index: 0, sourceHash: hash, fileName: file.name };
          App.busy = null;
          replace('scanreview');
          return;
        }
        App.busy = null;
        App.params = { pdfNoText: true, parsed: parsed, hash: hash, fileName: file.name };
        replace('noTextPdf');
        return;
      }

      await finishImport(parsed, { fileName: file.name, sourceHash: hash });
    } catch (e) {
      App.busy = null;
      const code = e && e.code;
      replace('error', {
        message: code === 'DRM_PROTECTED' ? t('drmBlocked')
          : code === 'FILE_TOO_LARGE' ? t('fileTooLarge')
            : code === 'LEGACY_DOC' ? t('unsupportedFormat') + ' (.doc)'
              : t('unsupportedFormat'),
        detail: code === 'DRM_PROTECTED' && e.resources && e.resources.length
          ? 'DRM_PROTECTED · ' + e.resources.filter(Boolean).slice(0, 3).join(', ')
          : e && e.message
      });
    }
  }

  async function finishImport(parsed, opts) {
    App.busy = { stage: 'stOrganizing', percent: 60 };
    renderProcessing();
    await pause(30);
    App.busy = { stage: 'stLanguage', percent: 75 };
    renderProcessing();
    await pause(30);
    const doc = await FV.Importer.build(parsed, opts);
    App.busy = { stage: 'stDirecting', percent: 92 };
    renderProcessing();
    await FV.Library.saveDocument(doc);
    App.docs = await FV.Library.listDocuments();
    App.doc = doc;
    App.busy = null;
    replace('book', { id: doc.id });
  }

  function pause(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      const fr = new FileReader();
      fr.onload = function () { resolve(fr.result); };
      fr.onerror = function () { reject(new Error('read failed')); };
      fr.readAsDataURL(blob);
    });
  }

  async function importPastedText(text, title) {
    if (!text.trim()) return;
    App.busy = { stage: 'stReading', percent: 20 };
    go('processing');
    const lines = FV.plainToLines(text);
    const parsed = { pages: FV.linesToPages(lines), meta: { title: title || '' }, kind: 'text', needsOcr: false };
    await finishImport(parsed, { fileName: title || 'texto', sourceHash: FV.hashString(text.slice(0, 4000)), title: title });
  }

  /* ------------------------------------------------------ OCR the scans  */
  async function runOcrOnScans() {
    const langs = [App.prefs.uiLang, 'de-DE', 'en-US'];
    App.busy = { stage: 'stOcr', percent: 0 };
    go('processing');
    const lines = [];
    let totalConf = 0, n = 0;
    try {
      for (let i = 0; i < App.scan.pages.length; i++) {
        const p = App.scan.pages[i];
        App.busy = { stage: 'stOcr', percent: Math.round(i / App.scan.pages.length * 100), detail: (i + 1) + '/' + App.scan.pages.length };
        renderProcessing();
        const res = await FV.Ocr.recognize(p.processedDataUrl || p.dataUrl, langs, function (pr) {
          App.busy = { stage: 'stOcr', percent: Math.round((i + (pr.percent || 0) / 100) / App.scan.pages.length * 100), detail: (i + 1) + '/' + App.scan.pages.length };
          renderProcessing();
        });
        p.ocr = res;
        totalConf += res.confidence || 0; n++;
        lines.push({ pageIndex: i, lines: res.lines });
      }
    } catch (e) {
      App.busy = null;
      replace('error', {
        message: e.code === 'OCR_UNAVAILABLE' ? t('ocrNeedsNet') : t('ocrFailed'),
        detail: e && e.message
      });
      return;
    }
    const pages = lines.map(function (l, i) { return { index: i, lines: l.lines }; });
    App.busy = null;
    App.params = { pages: pages, confidence: n ? Math.round(totalConf / n) : 0 };
    replace('ocrfix');
  }

  async function confirmOcrAndBuild() {
    const pages = App.params.pages;
    const edited = document.querySelectorAll('[data-ocrline]');
    for (const el of edited) {
      const ref = el.getAttribute('data-ocrline').split(':');
      const pi = parseInt(ref[0], 10), li = parseInt(ref[1], 10);
      if (pages[pi] && pages[pi].lines[li]) pages[pi].lines[li].text = el.value;
    }
    const parsed = { pages: pages, meta: {}, kind: 'scan', needsOcr: false, pageCount: pages.length };
    await finishImport(parsed, {
      fileName: App.scan.fileName || 'scan',
      sourceHash: App.scan.sourceHash || FV.hashString(String(Date.now())),
      pageImages: App.scan.pages.map(function (p) { return p.processedDataUrl || p.dataUrl; }),
      ocrConfidence: App.params.confidence
    });
  }

  /* ---------------------------------------------------------- open a book */
  async function openDocument(id) {
    const doc = await FV.Library.getDocument(id);
    if (!doc) { toast(t('errorTitle'), 'warn'); return; }
    App.doc = doc;
    doc.lastOpenedAt = Date.now();
    await FV.Library.saveDocument(doc);
    App.docs = await FV.Library.listDocuments();
    go('book', { id: id });
  }

  async function buildPlanForCurrent(opts) {
    opts = opts || {};
    const doc = App.doc;
    const blocks = FV.Importer.effectiveBlocks(doc);
    const structure = { blocks: blocks, chapters: doc.canonical.chapters, language: doc.language, stats: doc.stats, pageCount: doc.pageCount };
    const dict = await FV.Library.getDictionary();
    const bookDict = (doc.dictionary || []);
    const settings = doc.settings || {};
    const styleId = settings.style && settings.style !== 'auto' ? settings.style : doc.profile.defaultStyle;
    const experience = settings.experience && settings.experience !== 'auto'
      ? settings.experience
      : (doc.profile.genre === 'children' ? 'children'
        : doc.profile.genre === 'fiction' ? 'narrator-characters'
          : doc.profile.genre === 'academic' || doc.profile.genre === 'theology' ? 'hybrid' : 'natural-narrator');

    const plan = FV.buildNarrationPlan(structure, {
      lang: doc.language,
      styleId: styleId,
      experience: experience,
      profile: doc.profile,
      characters: doc.characters || [],
      cast: doc.cast || {},
      dictionary: bookDict.concat(dict),
      skip: App.prefs.skip,
      allowStyleShift: App.prefs.autoStyleShift
    });
    App.plan = plan;
    return plan;
  }

  function resolveCastVoices() {
    const doc = App.doc;
    const used = [];
    const narratorVoice = App.prefs.voiceByLang[doc.language] || null;
    if (narratorVoice) used.push(narratorVoice);
    const out = {};
    for (const c of (doc.characters || [])) {
      const entry = (doc.cast || {})[c.id];
      if (!entry) continue;
      const resolved = FV.resolveCastVoice(entry.archetype, doc.language, used, entry.voiceId);
      if (resolved.voiceId) used.push(resolved.voiceId);
      out[c.id] = resolved;
    }
    return out;
  }

  async function startPlayback(fromSegmentId) {
    const doc = App.doc;
    if (!App.player.supported()) { toast(t('noVoicesBody'), 'warn'); return; }
    const plan = App.plan || await buildPlanForCurrent();
    const progress = await FV.Library.getProgress(doc.id);
    const settings = doc.settings || {};
    let startIndex = 0;
    if (fromSegmentId) {
      startIndex = Math.max(0, plan.segments.filter(function (s) { return s.speak !== false; })
        .findIndex(function (s) { return s.id === fromSegmentId; }));
    } else if (progress && progress.segmentIndex) startIndex = progress.segmentIndex;

    const narratorVoiceId = App.prefs.voiceByLang[settings.readingMode === 'translated' && settings.targetLang ? settings.targetLang : doc.language]
      || (FV.Voices.pick(doc.language) || {}).id || null;

    App.player.load(plan, {
      startIndex: startIndex,
      rate: App.prefs.speed || 1,
      narratorVoiceId: narratorVoiceId,
      castVoices: resolveCastVoices(),
      targetLang: settings.targetLang || null,
      readingMode: settings.readingMode || 'original',
      translations: preloadTranslations(doc, settings.targetLang)
    });
    App.player.setSleepTimer(App.prefs.sleep || 'off');
    /* Start preparing translations before the first word is spoken so
       translated playback does not begin by waiting. */
    scheduleTranslationAhead();
    App.player.play();
    updatePlayerBar();
  }

  function preloadTranslations(doc, target) {
    if (!target || !doc.translations || !doc.translations[target]) return {};
    const out = {};
    for (const k in doc.translations[target]) out[k] = doc.translations[target][k];
    return out;
  }

  /* ----------------------------------------------------------- 4 library */
  function viewLibrary() {
    const q = (App.params.q || '').toLowerCase();
    const filter = App.params.filter || 'all';
    const sort = App.params.sort || 'recent';
    let docs = App.docs.slice();
    if (filter === 'favorites') docs = docs.filter(function (d) { return d.favorite; });
    else if (filter === 'archived') docs = docs.filter(function (d) { return d.archived; });
    else docs = docs.filter(function (d) { return !d.archived; });
    if (q) docs = docs.filter(function (d) { return (d.title + ' ' + d.author).toLowerCase().indexOf(q) >= 0; });
    if (sort === 'title') docs.sort(function (a, b) { return a.title.localeCompare(b.title); });

    const recent = App.docs.filter(function (d) { return d.lastOpenedAt && !d.archived; })[0];

    let html = '<header class="fv-head fv-head--main">' +
      '<div class="fv-brandline">' + FV.assets.wordmark({ voice: 'var(--fv-voice)' }) + '</div>' +
      '<button class="fv-icon-btn" data-action="go" data-view="settings" aria-label="' + esc(t('settings')) + '">' + icon('settings') + '</button>' +
      '</header>';

    html += '<div class="fv-pad">';
    html += hostBanner();
    html += '<div class="fv-searchrow"><span class="fv-search-ic">' + icon('search') + '</span>' +
      '<input class="fv-input fv-search" id="fv-q" type="search" placeholder="' + esc(t('search')) + '" value="' + esc(App.params.q || '') + '" aria-label="' + esc(t('search')) + '"></div>';

    html += '<div class="fv-chips" role="tablist">' +
      chip('all', t('filterAll'), filter) + chip('favorites', t('filterFavorites'), filter) + chip('archived', t('filterArchived'), filter) +
      '</div>';

    if (recent && !q) {
      const pr = recent.progressPercent || 0;

        cover(recent, 'sm') +

        '<small>' + esc(recent.author || langLabel(recent.language)) + '</small>' +
        '<span class="fv-bar"><i style="width:' + Math.round(pr * 100) + '%"></i></span></span>' +

      '<strong>' + esc(t('embeddedTitle')) + '</strong><br>' + esc(t('embeddedBody')) + '</div>';

  function chip(id, label, active) {
    return '<button class="fv-chip' + (active === id ? ' is-on' : '') + '" data-action="filter" data-filter="' + esc(id) + '">' + esc(label) + '</button>';

  function cover(d, size) {
    const initial = (d.title || '?').trim().charAt(0).toUpperCase();

      return '<span class="fv-cover fv-cover--' + size + '"><img src="' + esc(d.pageImages[0]) + '" alt=""></span>';
    }
    return '<span class="fv-cover fv-cover--' + size + '" style="--h:' + hue + '"><b>' + esc(initial) + '</b></span>';
  }

  /* -------------------------------------------------------------- 8 book */
  function viewBook() {
    const d = App.doc;
    if (!d) return viewLibrary();
    const chars = (d.characters || []).length;
    let html = header(t('bookDetails'), {
      right: '<button class="fv-icon-btn' + (d.favorite ? ' is-on' : '') + '" data-action="toggle-fav" aria-label="' + esc(t('favorite')) + '">' + icon('star') + '</button>'
    });
    html += '<div class="fv-pad">' +
      '<div class="fv-bookhead">' + cover(d, 'lg') +
      '<div><h2 class="fv-booktitle">' + esc(d.title) + '</h2>' +
      (d.author ? '<p class="fv-bookauthor">' + esc(d.author) + '</p>' : '') +
      '<p class="fv-meta">' + esc(langLabel(d.language)) +
      (d.languageConfidence < 0.3 ? ' <span class="fv-badge fv-badge--warn">' + esc(t('lowConfidence')) + '</span>' : '') +
      '</p>' +
      '<p class="fv-meta">' + esc(String(d.pageCount || 0)) + ' ' + esc(t('pages')) + ' · ' +
      esc(String(d.stats.words)) + ' ' + esc(t('words')) + ' · ' +
      esc(String(d.canonical.chapters.filter(function (c) { return !c.implicit; }).length)) + ' ' + esc(t('chapters')) +
      (chars ? ' · ' + chars + ' ' + esc(t('characters')) : '') + '</p>' +
      '<p class="fv-meta">' + esc(t('addedOn')) + ' ' + esc(fmtDate(d.addedAt)) + '</p>' +
      '</div></div>';

    html += '<button class="fv-btn fv-btn--primary fv-btn--wide" data-action="read-now">' + esc(t('readNow')) + '</button>';

    html += '<div class="fv-tiles">' +
      tile('go', 'translation', 'lang', t('translationMode') || t('readingModes')) +
      tile('go', 'voices', 'voice', t('voice')) +
      (chars ? tile('go', 'cast', 'cast', t('bookCast')) : '') +
      tile('go', 'ask', 'ask', t('askTitle')) +
      tile('go', 'bookmarks', 'bookmark', t('bookmarks')) +
      tile('go', 'notes', 'note', t('notes')) +
      tile('go', 'pronunciation', 'voice', t('pronunciation')) +
      tile('go', 'export', 'download', t('exportAudio')) +
      '</div>';

    html += '<div class="fv-note"><strong>' + esc(t('detectedLanguage')) + ':</strong> ' + esc(langLabel(d.language)) +
      ' <button class="fv-link" data-action="go" data-view="language">' + esc(t('changeLanguage')) + '</button></div>';

    html += '<h3 class="fv-h3">' + esc(t('chapterList')) + '</h3><ol class="fv-chapters">';
    for (const c of d.canonical.chapters) {
      if (c.implicit && !c.title) continue;
      html += '<li><button data-action="read-chapter" data-chapter="' + esc(c.id) + '">' + esc(c.title || '—') + '</button></li>';
    }
    html += '</ol>';

  function tile(action, view, ic, label) {
    return '<button class="fv-tile" data-action="' + action + '" data-view="' + esc(view) + '">' +
      '<span>' + icon(ic) + '</span><small>' + esc(label) + '</small></button>';
  }

  /* ------------------------------------------------------------ 9 reader */
  function viewReader() {
    const d = App.doc;
    if (!d || !App.plan) return viewBook();
    const mode = (d.settings && d.settings.readingMode) || 'original';
    const segsByBlock = {};
    for (const s of App.plan.segments) (segsByBlock[s.blockId] = segsByBlock[s.blockId] || []).push(s);

    let html = header(d.title, {
      right: '<button class="fv-icon-btn" data-action="go" data-view="ask" aria-label="' + esc(t('ask')) + '">' + icon('ask') + '</button>'
    });
    html += '<div class="fv-readerbar">' +
      '<button class="fv-chip" data-action="go" data-view="translation">' + esc(t(modeKey(mode))) + '</button>' +
      '<button class="fv-chip" data-action="go" data-view="voices">' + esc(t('voice')) + '</button>' +
      '<button class="fv-chip" data-action="bookmark-here">' + esc(t('bookmark')) + '</button>' +
      '<button class="fv-chip" data-action="note-here">' + esc(t('note')) + '</button>' +
      '</div>';
    html += '<article class="fv-reader' + (mode === 'sidebyside' ? ' is-split' : '') + '">';

    const blocks = FV.Importer.effectiveBlocks(d);
    for (const b of blocks) {
      const segs = segsByBlock[b.id] || [];
      const tag = b.type === 'heading' ? 'h2' : 'p';
      const cls = 'fv-block fv-block--' + b.type;
      html += '<' + tag + ' class="' + cls + '" data-block="' + esc(b.id) + '">';
      if (segs.length) {
        for (const s of segs) {
          html += '<span class="fv-seg" data-seg="' + esc(s.id) + '" data-full="' + esc(s.sourceText) + '" tabindex="0" role="button">' + esc(s.sourceText) + '</span> ';
        }
      } else html += esc(b.text);
      html += '</' + tag + '>';
      if (mode === 'sidebyside' && segs.length) {
        html += '<p class="fv-block fv-block--translation">';
        for (const s of segs) {
          const tr = (App.player && App.player.translations[s.id]) || (d.translations[d.settings.targetLang] || {})[s.id];
          html += '<span class="fv-trans' + (tr ? '' : ' is-pending') + '" data-trans="' + esc(s.id) + '">' + esc(tr || t('translating')) + '</span> ';
        }
        html += '</p>';
      }
    }
    html += '</article>';
    return html;
  }
  function modeKey(m) {
    return m === 'translated' ? 'modeTranslated' : m === 'bilingual' ? 'modeBilingual' :
      m === 'sidebyside' ? 'modeSideBySide' : m === 'readalong' ? 'modeReadAlong' : 'modeOriginal';
  }

  function renderPlayerBar() {
    if (!App.doc || !App.plan || ['splash', 'onboarding', 'mode', 'processing'].indexOf(App.view) >= 0) return '';
    const st = App.player.state();
    const seg = App.player.currentSegment();
    return '<div class="fv-playerbar" id="fv-playerbar">' +
      '<div class="fv-pb-progress"><i style="width:' + (st.progress * 100).toFixed(1) + '%"></i></div>' +
      '<div class="fv-pb-row">' +
      '<div class="fv-pb-now"><strong>' + esc(currentChapterTitle() || App.doc.title) + '</strong>' +
      '<small id="fv-now-text">' + esc(seg ? seg.sourceText.slice(0, 90) : '') + '</small></div>' +
      '<div class="fv-pb-controls">' +
      '<button class="fv-icon-btn" data-action="prev-chapter" aria-label="' + esc(t('prevChapter')) + '">' + icon('prev') + '</button>' +
      '<button class="fv-icon-btn" data-action="skip-back" aria-label="' + esc(t('back15')) + '">' + icon('back15') + '</button>' +
      '<button class="fv-play" data-action="toggle-play" aria-label="' + esc(st.playing ? t('pause') : t('play')) + '">' + icon(st.playing ? 'pause' : 'play') + '</button>' +
      '<button class="fv-icon-btn" data-action="skip-fwd" aria-label="' + esc(t('fwd15')) + '">' + icon('fwd15') + '</button>' +
      '<button class="fv-icon-btn" data-action="next-chapter" aria-label="' + esc(t('nextChapter')) + '">' + icon('next') + '</button>' +
      '</div>' +
      '<div class="fv-pb-side">' +
      '<span class="fv-time">' + esc(fmtTime(st.elapsed)) + ' / -' + esc(fmtTime(st.remaining)) + '</span>' +
      '<button class="fv-chip fv-chip--tiny" data-action="cycle-speed" aria-label="' + esc(t('speed')) + '">' + st.rate.toFixed(2).replace(/0$/, '') + '×</button>' +
      '<button class="fv-chip fv-chip--tiny" data-action="sleep-menu" aria-label="' + esc(t('sleepTimer')) + '">' + icon('sleep') + '</button>' +
      '</div></div></div>';

  function updatePlayerBar() {
    const bar = document.getElementById('fv-playerbar');

  /* --------------------------------------------------------- 10 cast etc */
  function viewCast() {
    const d = App.doc;
    const chars = (d && d.characters) || [];
    let html = header(t('bookCast'), {
      right: '<button class="fv-icon-btn" data-action="recast-all" aria-label="' + esc(t('recastAll')) + '">↻</button>'
    });
    html += '<div class="fv-pad"><p class="fv-hint">' + esc(t('castHint')) + '</p>';
    if (!chars.length) {
      html += '<div class="fv-note">' + esc(t('noCharacters')) + '</div></div>';
      return html;
    }
    const groups = {};
    for (const a of FV.VOICE_ARCHETYPES) (groups[a.group] = groups[a.group] || []).push(a);
    for (const c of chars) {
      const entry = (d.cast || {})[c.id] || { archetype: 'narrator' };
      html += '<div class="fv-castrow">' +
        '<div class="fv-castmain"><strong>' + esc(c.name) + '</strong>' +
        '<small>' + esc(c.role === 'protagonist' ? t('role') + ': ' + esc(c.name) : '') + ' · ' + esc(String(c.mentions)) + '×' +
        (c.aliases && c.aliases.length ? ' · ' + esc(c.aliases.join(', ')) : '') + '</small></div>' +
        '<select class="fv-select" data-action="cast-set" data-char="' + esc(c.id) + '">';
      for (const g in groups) {
        html += '<optgroup label="' + esc(g) + '">';
        for (const a of groups[g]) {
          html += '<option value="' + esc(a.id) + '"' + (entry.archetype === a.id ? ' selected' : '') + '>' + esc(a.id.replace(/-/g, ' ')) + '</option>';
        }
        html += '</optgroup>';
      }
      html += '</select>' +
        '<button class="fv-mini" data-action="cast-preview" data-char="' + esc(c.id) + '">' + esc(t('preview')) + '</button>' +
        '<button class="fv-mini' + (entry.locked ? ' is-on' : '') + '" data-action="cast-lock" data-char="' + esc(c.id) + '">' + esc(entry.locked ? t('unlockVoice') : t('lockVoice')) + '</button>' +
        '<button class="fv-mini" data-action="cast-narrator" data-char="' + esc(c.id) + '">' + esc(t('narratorFallback')) + '</button>' +
        '</div>';
    }
    html += '<h3 class="fv-h3">' + esc(t('mergeCharacter')) + '</h3><div class="fv-mergerow">' +
      '<select class="fv-select" id="fv-merge-a">' + chars.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('') + '</select>' +
      '<select class="fv-select" id="fv-merge-b">' + chars.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join('') + '</select>' +
      '<button class="fv-btn fv-btn--ghost" data-action="cast-merge">' + esc(t('apply')) + '</button></div>';
    html += '</div>';
    return html;

  function viewVoices() {
    const d = App.doc;
    const lang = (d && d.settings && d.settings.readingMode === 'translated' && d.settings.targetLang) ? d.settings.targetLang : (d ? d.language : App.prefs.uiLang);
    const list = FV.Voices.forLang(lang);
    const chosen = App.prefs.voiceByLang[lang] || (FV.Voices.pick(lang) || {}).id;
    let html = header(t('voices'), {
      right: '<button class="fv-icon-btn" data-action="go" data-view="voicelab" aria-label="' + esc(t('voiceLab')) + '">' + icon('voice') + '</button>'
    });
    html += '<div class="fv-pad">';
    html += hostBanner();
    html += '<div class="fv-note"><strong>' + esc(t('language')) + ':</strong> ' + esc(langLabel(lang)) + '</div>';
    html += '<button class="fv-btn fv-btn--primary fv-btn--wide" data-action="test-voice" data-lang="' + esc(lang) + '">' + esc(t('testVoice')) + '</button>';
    if (!FV.Voices.all().length) {
      html += '<div class="fv-note fv-note--warn"><strong>' + esc(t('noVoices')) + '</strong><br>' + esc(t('noVoicesBody')) + '</div>';
    } else if (!list.length) {
      html += '<div class="fv-note fv-note--warn">' + esc(t('noVoiceForLang')) + '</div>';
    }
    for (const v of list) {
      html += '<div class="fv-voicerow' + (v.id === chosen ? ' is-on' : '') + '">' +
        '<button class="fv-voicepick" data-action="pick-voice" data-voice="' + esc(v.id) + '" data-lang="' + esc(lang) + '">' +
        '<strong>' + esc(v.name) + '</strong>' +
        '<small>' + esc(v.locale) + ' · ' + esc(FV.Voices.genderLabel(v.gender)) +
        (v.premium ? ' · <b>' + esc(v.provider) + '</b>' : ' · ' + esc(v.localService ? 'local' : 'network')) +
        (v.description ? ' · ' + esc(v.description) : '') + '</small></button>' +
        '<button class="fv-mini" data-action="preview-voice" data-voice="' + esc(v.id) + '" data-lang="' + esc(lang) + '">' + esc(t('preview')) + '</button>' +
        (v.id === chosen ? '<span class="fv-check">' + icon('check') + '</span>' : '') +

  function searchDocument(query) {
    const d = App.doc;
    if (!d || !query.trim()) return [];
    const terms = query.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(function (w) { return w.length > 2; });
    if (!terms.length) return [];
    const blocks = FV.Importer.effectiveBlocks(d);
    const scored = [];
    for (const b of blocks) {
      const low = b.text.toLowerCase();
      let score = 0;
      for (const term of terms) {
        const n = low.split(term).length - 1;
        score += n * (term.length > 5 ? 2 : 1);
      }
      if (score > 0) scored.push({ block: b, score: score / Math.sqrt(Math.max(30, b.text.length)) });
    }
    scored.sort(function (a, b) { return b.score - a.score; });
    const chapters = d.canonical.chapters;
    return scored.slice(0, 6).map(function (s) {
      const ch = chapters.filter(function (c) { return c.id === s.block.chapter; })[0];
      let html = esc(s.block.text.slice(0, 460));
      for (const term of terms) {
        html = html.replace(new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
      }
      return { blockId: s.block.id, chapterTitle: ch ? ch.title : '', pageNumber: s.block.pageNumber, html: html };
    });
  }

  function viewStats() {
    const ev = App.params.events || [];
    const today = new Date().toISOString().slice(0, 10);
    const todayEv = ev.filter(function (e) { return e.day === today; })[0];
    const todayMin = Math.round(((todayEv && todayEv.seconds) || 0) / 60);
    const goal = App.prefs.dailyGoalMinutes || 15;
    const sorted = ev.slice().sort(function (a, b) { return a.day < b.day ? 1 : -1; });
    let streak = 0;
    const dayMs = 86400000;
    for (let i = 0; ; i++) {
      const d = new Date(Date.now() - i * dayMs).toISOString().slice(0, 10);
      const e = ev.filter(function (x) { return x.day === d; })[0];
      if (e && e.seconds > 60) streak++;
      else if (i > 0) break;
      else if (!e) break;
      if (i > 400) break;
    }
    const weekSecs = sorted.slice(0, 7).reduce(function (a, e) { return a + e.seconds; }, 0);
    const finished = App.docs.filter(function (d) { return (d.progressPercent || 0) > 0.97; }).length;

    let html = '<header class="fv-head fv-head--main"><h1 class="fv-head-title">' + esc(t('stats')) + '</h1>' +
      '<button class="fv-icon-btn" data-action="go" data-view="goals" aria-label="' + esc(t('goals')) + '">' + icon('settings') + '</button></header>';
    html += '<div class="fv-pad">';
    html += '<div class="fv-statgrid">' +
      stat(todayMin + '′', t('minutesListened')) +
      stat(String(streak), t('streak') + ' (' + t('days') + ')') +
      stat(Math.round(weekSecs / 60) + '′', t('thisWeek')) +
      stat(String(finished), t('booksDone')) +
      '</div>';
    const pct = Math.min(100, Math.round(todayMin / Math.max(1, goal) * 100));
    html += '<h3 class="fv-h3">' + esc(t('dailyGoal')) + '</h3>' +
      '<div class="fv-bar fv-bar--big"><i style="width:' + pct + '%"></i></div>' +
      '<p class="fv-fine">' + todayMin + ' / ' + goal + ' ' + esc(t('minutes')) + '</p>' +
      (pct >= 100 ? '<div class="fv-note fv-note--ok">' + esc(t('goalReached')) + '</div>' : '');

    html += '<h3 class="fv-h3">' + esc(t('history')) + '</h3><div class="fv-spark">';
    const last14 = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(Date.now() - i * dayMs).toISOString().slice(0, 10);
      const e = ev.filter(function (x) { return x.day === d; })[0];
      last14.push({ day: d, min: Math.round(((e && e.seconds) || 0) / 60) });
    }
    const max = Math.max(1, ...last14.map(function (x) { return x.min; }));
    for (const d of last14) {
      html += '<span class="fv-sparkbar" style="height:' + Math.max(4, Math.round(d.min / max * 100)) + '%" title="' + esc(d.day) + ': ' + d.min + '′"></span>';
    }
    html += '</div></div>';
    return html;
  }
